<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Steam Recording Exports</title>
    <style>
        * { box-sizing: border-box; }

        body {
            margin: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            font-size: 14px;
            line-height: 1.5;
            color: #1f2328;
            background: #fff;
        }

        a { color: #0969da; text-decoration: none; }
        a:hover { text-decoration: underline; }

        .site-header {
            background: #f6f8fa;
            border-bottom: 1px solid #d1d9e0;
        }
        .site-header .wrap {
            padding-top: 20px;
            padding-bottom: 20px;
        }
        .site-header h1 {
            margin: 0;
            font-size: 20px;
            font-weight: 600;
        }
        .site-header p {
            margin: 4px 0 0;
            font-size: 13px;
            color: #59636e;
        }

        .wrap {
            max-width: 980px;
            margin: 0 auto;
            padding-left: 16px;
            padding-right: 16px;
        }

        main.wrap {
            padding-top: 16px;
            padding-bottom: 48px;
        }

        .toolbar {
            display: flex;
            gap: 8px;
            margin-bottom: 8px;
        }
        .toolbar input[type="search"] {
            flex: 0 1 320px;
            min-width: 0;
            padding: 5px 12px;
            font: inherit;
            color: inherit;
            background: #fff;
            border: 1px solid #d1d9e0;
            border-radius: 6px;
        }
        .toolbar input[type="search"]:focus {
            outline: 2px solid #0969da;
            outline-offset: -1px;
        }

        .btn {
            display: inline-block;
            padding: 4px 12px;
            font: inherit;
            font-size: 13px;
            line-height: 20px;
            color: #1f2328;
            background: #f6f8fa;
            border: 1px solid rgba(31, 35, 40, 0.15);
            border-radius: 6px;
            cursor: pointer;
        }
        .btn:hover {
            background: #eef1f4;
            text-decoration: none;
        }
        .btn-primary {
            color: #fff;
            background: #1f883d;
        }
        .btn-primary:hover {
            background: #1a7f37;
        }

        .summary {
            margin: 8px 0 16px;
            font-size: 13px;
            color: #59636e;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }
        thead th {
            padding: 8px;
            font-size: 12px;
            font-weight: 600;
            text-align: left;
            color: #59636e;
            border-bottom: 1px solid #d1d9e0;
            white-space: nowrap;
        }
        th.sortable {
            cursor: pointer;
            user-select: none;
        }
        th.sortable:hover { color: #1f2328; }
        th.sorted-asc::after { content: " \2191"; }
        th.sorted-desc::after { content: " \2193"; }

        tbody td {
            padding: 10px 8px;
            border-bottom: 1px solid #eaeef2;
            vertical-align: top;
            word-break: break-word;
        }
        tbody tr:hover { background: #f6f8fa; }

        td.num, th.num { text-align: right; white-space: nowrap; }
        .file-meta {
            margin-top: 2px;
            font-size: 12px;
            color: #59636e;
        }
        .actions {
            text-align: right;
            white-space: nowrap;
        }
        .actions .btn { margin-left: 6px; }

        .state {
            padding: 40px 0;
            text-align: center;
            color: #59636e;
        }
        .state p { margin: 0 0 12px; }
        .state.error { color: #d1242f; }

        .site-footer {
            border-top: 1px solid #eaeef2;
            font-size: 12px;
            color: #59636e;
        }
        .site-footer .wrap {
            padding-top: 16px;
            padding-bottom: 32px;
        }

        .modal {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.55);
            z-index: 100;
        }
        .modal.open { display: block; }
        .modal-dialog {
            width: calc(100% - 32px);
            max-width: 860px;
            margin: 48px auto 0;
            background: #fff;
            border-radius: 6px;
            overflow: hidden;
        }
        .modal-head {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 10px 12px 10px 16px;
            border-bottom: 1px solid #eaeef2;
        }
        .modal-head h2 {
            margin: 0;
            font-size: 14px;
            font-weight: 600;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .modal-close {
            padding: 4px 8px;
            font-size: 18px;
            line-height: 1;
            color: #59636e;
            background: none;
            border: none;
            border-radius: 6px;
            cursor: pointer;
        }
        .modal-close:hover { background: #eef1f4; }
        .modal-body video {
            display: block;
            width: 100%;
            height: auto;
            background: #000;
        }

        @media (max-width: 600px) {
            .hide-sm { display: none; }
        }
    </style>
</head>
<body>
    <header class="site-header">
        <div class="wrap">
            <h1>Steam Recording Exports</h1>
            <p>Videos exported from Steam recordings, shared on your local network.</p>
        </div>
    </header>

    <main class="wrap">
        <div class="toolbar">
            <input id="filter" type="search" placeholder="Filter by name" aria-label="Filter videos by name">
            <button id="refresh" class="btn" type="button">Refresh</button>
        </div>
        <p class="summary" id="summary"></p>

        <div id="loading" class="state">Loading&hellip;</div>

        <div id="error" class="state error" hidden>
            <p id="errorMessage"></p>
            <button id="retry" class="btn" type="button">Try again</button>
        </div>

        <div id="empty" class="state" hidden>
            <p>No exported videos yet. Export some recordings first.</p>
        </div>

        <div id="noMatches" class="state" hidden>
            <p>No videos match the current filter.</p>
        </div>

        <div id="tableWrap" hidden>
            <table>
                <thead>
                    <tr>
                        <th class="sortable" data-key="displayName">Name</th>
                        <th class="sortable num hide-sm" data-key="fileSizeBytes">Size</th>
                        <th class="sortable hide-sm" data-key="creationTimeMs">Recorded</th>
                        <th class="actions"></th>
                    </tr>
                </thead>
                <tbody id="rows"></tbody>
            </table>
        </div>
    </main>

    <footer class="site-footer">
        <div class="wrap">Served locally by Pineapple Steam Recording Exporter.</div>
    </footer>

    <div id="videoModal" class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
        <div class="modal-dialog">
            <div class="modal-head">
                <h2 id="modalTitle"></h2>
                <button id="modalClose" class="modal-close" type="button" aria-label="Close">&times;</button>
            </div>
            <div class="modal-body">
                <video id="modalVideo" controls></video>
            </div>
        </div>
    </div>

    <script>
        "use strict";

        let videos = [];
        let renderedRows = [];
        let totalSizeText = "";
        const sortState = { key: "creationTimeMs", dir: "desc" };

        const $ = (id) => document.getElementById(id);

        function escapeHtml(text) {
            const div = document.createElement("div");
            div.textContent = text == null ? "" : String(text);
            return div.innerHTML;
        }

        function downloadUrl(fileName) {
            return "/download/" + encodeURIComponent(fileName);
        }

        function visibleRows() {
            const query = $("filter").value.trim().toLowerCase();
            const rows = query
                ? videos.filter((v) =>
                      (v.displayName + "\n" + v.fileName).toLowerCase().includes(query))
                : videos.slice();
            const factor = sortState.dir === "asc" ? 1 : -1;
            const key = sortState.key;
            rows.sort((a, b) => {
                const va = a[key];
                const vb = b[key];
                if (typeof va === "string" || typeof vb === "string") {
                    return factor * String(va ?? "").localeCompare(String(vb ?? ""));
                }
                return factor * ((Number(va) || 0) - (Number(vb) || 0));
            });
            return rows;
        }

        function rowHtml(video, index) {
            const url = downloadUrl(video.fileName);
            const meta = video.fileName !== video.displayName
                ? `<div class="file-meta">${escapeHtml(video.fileName)}</div>`
                : "";
            return `<tr>
                <td>
                    <a href="${url}">${escapeHtml(video.displayName)}</a>${meta}
                </td>
                <td class="num hide-sm">${escapeHtml(video.fileSize)}</td>
                <td class="hide-sm">${escapeHtml(video.creationTime)}</td>
                <td class="actions">
                    <button class="btn" type="button" data-preview="${index}">Preview</button>
                    <a class="btn btn-primary" href="${url}" download>Download</a>
                </td>
            </tr>`;
        }

        function updateSummary(shownCount) {
            let text = videos.length + (videos.length === 1 ? " video" : " videos");
            if (totalSizeText) {
                text += ", " + totalSizeText + " total";
            }
            if (shownCount !== videos.length) {
                text += ", " + shownCount + " shown";
            }
            $("summary").textContent = text;
        }

        function updateSortHeaders() {
            document.querySelectorAll("th.sortable").forEach((th) => {
                const active = th.dataset.key === sortState.key;
                th.classList.toggle("sorted-asc", active && sortState.dir === "asc");
                th.classList.toggle("sorted-desc", active && sortState.dir === "desc");
                th.setAttribute("aria-sort",
                    active ? (sortState.dir === "asc" ? "ascending" : "descending") : "none");
            });
        }

        function render() {
            const rows = visibleRows();
            renderedRows = rows;
            $("loading").hidden = true;
            $("error").hidden = true;
            $("empty").hidden = videos.length !== 0;
            $("noMatches").hidden = !(videos.length !== 0 && rows.length === 0);
            $("tableWrap").hidden = videos.length === 0;
            $("rows").innerHTML = rows.map(rowHtml).join("");
            updateSummary(rows.length);
        }

        async function loadVideoList() {
            $("loading").hidden = false;
            $("error").hidden = true;
            $("empty").hidden = true;
            $("noMatches").hidden = true;
            $("tableWrap").hidden = true;

            try {
                const response = await fetch("/api/videos");
                if (!response.ok) {
                    throw new Error("HTTP " + response.status + " " + response.statusText);
                }
                const data = await response.json();
                videos = data.videos || [];
                totalSizeText = data.totalSize || "";
                render();
            } catch (error) {
                $("loading").hidden = true;
                $("errorMessage").textContent = "Failed to load the video list: " + error.message;
                $("error").hidden = false;
            }
        }

        function openPreview(video) {
            $("modalTitle").textContent = video.displayName;
            $("modalVideo").src = downloadUrl(video.fileName);
            $("videoModal").classList.add("open");
        }

        function closeModal() {
            const video = $("modalVideo");
            video.pause();
            video.removeAttribute("src");
            video.load();
            $("videoModal").classList.remove("open");
        }

        $("rows").addEventListener("click", (event) => {
            const button = event.target.closest("button[data-preview]");
            if (!button) {
                return;
            }
            const video = renderedRows[Number(button.dataset.preview)];
            if (video) {
                openPreview(video);
            }
        });

        document.querySelectorAll("th.sortable").forEach((th) => {
            th.addEventListener("click", () => {
                const key = th.dataset.key;
                if (sortState.key === key) {
                    sortState.dir = sortState.dir === "asc" ? "desc" : "asc";
                } else {
                    sortState.key = key;
                    sortState.dir = key === "displayName" ? "asc" : "desc";
                }
                updateSortHeaders();
                render();
            });
        });

        $("filter").addEventListener("input", render);
        $("refresh").addEventListener("click", loadVideoList);
        $("retry").addEventListener("click", loadVideoList);
        $("modalClose").addEventListener("click", closeModal);
        $("videoModal").addEventListener("click", (event) => {
            if (event.target === $("videoModal")) {
                closeModal();
            }
        });
        document.addEventListener("keydown", (event) => {
            if (event.key === "Escape") {
                closeModal();
            }
        });

        updateSortHeaders();
        loadVideoList();
    </script>
</body>
</html>
