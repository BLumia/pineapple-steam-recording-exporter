app-id: net.blumia.pineapple.steam-recording-exporter
runtime: org.kde.Platform
runtime-version: '6.8'
sdk: org.kde.Sdk
command: PineappleSteamRecordingExporter
rename-icon: net.blumia.pineapple.steam-recording-exporter

finish-args:
  # X11 and Wayland support
  - --share=ipc
  - --socket=x11
  - --socket=wayland
  
  # Audio/Video support
  - --socket=pulseaudio
  - --device=dri
  
  # File system access
  - --filesystem=home:ro
  - --filesystem=~/.local/share/Steam:ro
  - --filesystem=~/.steam:ro
  - --filesystem=~/Videos:rw
  - --filesystem=~/Movies:rw
  
  # Network access (for potential future features)
  - --share=network
  
  # D-Bus access for desktop integration
  - --talk-name=org.freedesktop.FileManager1
  - --talk-name=org.gtk.vfs.*
  
  # Environment variables
  - --env=QT_QPA_PLATFORM=xcb

modules:
  - name: ffmpeg
    buildsystem: autotools
    config-opts:
      - --enable-shared
      - --disable-static
      - --enable-gnutls
      - --disable-doc
      - --disable-programs
      - --disable-encoders
      - --disable-muxers
      - --enable-encoder=libx264
      - --enable-encoder=aac
      - --enable-muxer=mp4
      - --enable-muxer=matroska
      - --enable-protocol=file
      - --enable-protocol=pipe
    sources:
      - type: archive
        url: https://ffmpeg.org/releases/ffmpeg-6.1.1.tar.xz
        sha256: 8684f4b00f94b85461884c3719382f1261f0d9eb3d59640a1f4ac0873616f968
    cleanup:
      - /include
      - /lib/pkgconfig
      - /share/ffmpeg/examples

  - name: PineappleSteamRecordingExporter
    buildsystem: cmake-ninja
    config-opts:
      - -DCMAKE_BUILD_TYPE=RelWithDebInfo
      - -DCMAKE_INSTALL_PREFIX=/app
    sources:
      - type: git
        url: https://github.com/pineapple-tools/steam-recording-exporter.git
        tag: v1.0.0
        commit: main
    post-install:
      - install -Dm644 packaging/linux/net.blumia.pineapple.steam-recording-exporter.desktop -t /app/share/applications/
      - install -Dm644 packaging/linux/net.blumia.pineapple.steam-recording-exporter.metainfo.xml -t /app/share/metainfo/
      - install -Dm644 qml/app_icon.png /app/share/icons/hicolor/256x256/apps/net.blumia.pineapple.steam-recording-exporter.png
      - install -Dm644 qml/app_icon.png /app/share/icons/hicolor/128x128/apps/net.blumia.pineapple.steam-recording-exporter.png
      - install -Dm644 qml/app_icon.png /app/share/icons/hicolor/64x64/apps/net.blumia.pineapple.steam-recording-exporter.png
      - install -Dm644 qml/app_icon.png /app/share/icons/hicolor/48x48/apps/net.blumia.pineapple.steam-recording-exporter.png